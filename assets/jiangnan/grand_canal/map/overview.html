<script>
const svg = document.getElementById('map');
const routes = document.getElementById('routes');
const frames = document.getElementById('frames');
const labels = [...document.querySelectorAll('.label')];
const cursor = document.getElementById('cursor');
document.getElementById('rt').onchange = e => routes.style.display = e.target.checked ? '' : 'none';
document.getElementById('lt').onchange = e => labels.forEach(x => x.style.display = e.target.checked ? '' : 'none');
document.getElementById('ft').onchange = e => frames.style.display = e.target.checked ? '' : 'none';
svg.onmousemove = e => {
    const p0 = svg.createSVGPoint();
    p0.x = e.clientX; p0.y = e.clientY;
    const p = p0.matrixTransform(svg.getScreenCTM().inverse());
    cursor.textContent = `鼠标主图坐标：(${p.x.toFixed(1)}, ${(18563.996-p.y).toFixed(1)})`;
};
</script>
<script>(()=>{const s=document.getElementById('map');if(!s)return;const BASE={x:0,y:0,w:27020,h:18677};let v={...BASE};let dragging=false,lastX=0,lastY=0;function apply(){s.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);}function reset(){v={...BASE};apply();}function point(ev){const p=s.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(s.getScreenCTM().inverse());}function zoomAt(f,cx,cy){const nw=Math.max(BASE.w*0.035,Math.min(BASE.w*2,v.w*f));const real=nw/v.w;const nh=v.h*real;v.x=cx-(cx-v.x)*real;v.y=cy-(cy-v.y)*real;v.w=nw;v.h=nh;apply();}s.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoomAt(e.deltaY>0?1.16:0.86,p.x,p.y);},{passive:false});s.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;lastX=e.clientX;lastY=e.clientY;s.setPointerCapture(e.pointerId);s.style.cursor='grabbing';});s.addEventListener('pointermove',e=>{if(!dragging)return;const r=s.getBoundingClientRect();v.x-=(e.clientX-lastX)*v.w/r.width;v.y-=(e.clientY-lastY)*v.h/r.height;lastX=e.clientX;lastY=e.clientY;apply();});function up(e){dragging=false;s.style.cursor='grab';try{s.releasePointerCapture(e.pointerId)}catch(_e){}}s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up);s.addEventListener('dblclick',reset);document.getElementById('zin').onclick=()=>zoomAt(.78,v.x+v.w/2,v.y+v.h/2);document.getElementById('zout').onclick=()=>zoomAt(1.28,v.x+v.w/2,v.y+v.h/2);document.getElementById('zreset').onclick=reset;})();</script>
